name: Validate reference implementation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Validate Terraform formatting
        run: terraform fmt -diff -recursive infra/aws
      - name: Validate JSON
        run: python3 -m json.tool infra/aws/trust-policy.template.json
      - name: Validate reference implementation
        run: python3 scripts/validate_reference.py
      - name: Run deterministic model
        run: python3 simulation/exposure_model.py
