<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><rect width="1400" height="700" fill="#f7faff"/><style>.t{font:700 34px Arial;fill:#17345e}.h{font:700 22px Arial;fill:#164b99}.b{font:16px Arial;fill:#4b6078}.x{fill:white;stroke:#9bbbe5;stroke-width:2}.a{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#2563eb"/></marker></defs><text x="50" y="55" class="t">Secretless Multi-Cloud Authentication</text><text x="50" y="88" class="b">OIDC workload identity federation for DevSecOps pipelines</text><rect x="45" y="140" width="260" height="420" rx="18" class="x"/><text x="70" y="180" class="h">1. Workload</text><text x="70" y="220" class="b">CI/CD • MLOps • Kubernetes</text><text x="70" y="270" class="b">No persistent cloud keys</text><rect x="365" y="140" width="270" height="420" rx="18" class="x"/><text x="390" y="180" class="h">2. Identity</text><text x="390" y="270" class="b">OIDC issuer</text><text x="390" y="305" class="b">Short-lived JWT</text><rect x="695" y="140" width="300" height="420" rx="18" class="x"/><text x="720" y="180" class="h">3. Trust Boundary</text><text x="720" y="260" class="b">issuer + audience</text><text x="720" y="295" class="b">repository + branch/env</text><text x="720" y="330" class="b">claim-based policy</text><text x="720" y="400" class="b">ALLOW authorized claims</text><text x="720" y="440" class="b">DENY wrong claims</text><rect x="1055" y="140" width="300" height="420" rx="18" class="x"/><text x="1080" y="180" class="h">4. Multi-Cloud</text><text x="1080" y="245" class="b">AWS IAM / STS</text><text x="1080" y="295" class="b">Google Cloud WIF</text><text x="1080" y="345" class="b">Microsoft Entra</text><text x="1080" y="420" class="b">Scoped temporary access</text><text x="1080" y="465" class="b">Cloud APIs / Data / Compute</text><path d="M305 350L365 350" class=